<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://vpxvazxmidbqajlhdqxz.supabase.co; base-uri 'none'; form-action 'none'" />
  <title>QADAM OFFICE — Kirish</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
  :root { color-scheme: dark; } * {box-sizing:border-box} body {margin:0;background:#0e1119;color:#f7f7f7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding:24px} main {max-width:420px;margin:8vh auto 0} .logo{width:64px;height:64px;border-radius:18px;background:#e67837;display:grid;place-items:center;font-weight:900;font-size:30px;color:#16171d} h1{letter-spacing:.03em;margin:20px 0 4px;font-size:29px} p{color:#aeb6c5;line-height:1.5} label{display:block;margin:22px 0 6px;font-size:14px;font-weight:600} input{display:block;width:100%;border-radius:14px;padding:16px;background:#1d2430;border:1px solid #3d4859;color:#fff;font:inherit} input:focus{outline:2px solid #e67837;outline-offset:1px} button{background:#e67837;color:#16171d;font:inherit;font-weight:750;border:0;border-radius:14px;padding:17px;width:100%;margin-top:25px} button:disabled{opacity:.55} .msg{min-height:45px;white-space:pre-wrap;margin-top:18px} small{display:block;color:#8892a2;margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <div class="logo">Q</div>
    <h1>QADAM OFFICE</h1>
    <p>Xodim kabinetiga xavfsiz kirish</p>
    <form id="loginForm" autocomplete="off">
      <label for="employeeCode">Xodim ID</label>
      <input id="employeeCode" maxlength="12" autocapitalize="characters" autocomplete="username" placeholder="Xodim kodingiz" required />
      <label for="employeePassword">Parol</label>
      <input id="employeePassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" placeholder="Parolingizni kiriting" required />
      <button id="submit" type="submit">🔐 Kirish</button>
    </form>
    <p class="msg" id="status" role="status" aria-live="polite"></p>
    <small>Parolni botga xabar qilib yubormang. Kirish faqat tasdiqlangan Telegram akkauntidan amalga oshiriladi.</small>
  </main>
  <script>
    'use strict';
    const app = window.Telegram?.WebApp;
    app?.ready(); app?.expand();
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!app?.initData) { status.textContent = 'Bu sahifani QADAM OFFICE botidagi «Kirish» tugmasidan oching.'; return; }
      const passwordField = document.getElementById('employeePassword');
      const code = document.getElementById('employeeCode').value.trim().toUpperCase();
      const password = passwordField.value;
      passwordField.value = '';
      status.textContent = 'Tekshirilmoqda…'; submit.disabled = true;
      try {
        const response = await fetch('https://vpxvazxmidbqajlhdqxz.supabase.co/functions/v1/qadam-office-bot/login', {
          method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
          body:JSON.stringify({initData:app.initData,code,password})
        });
        const result = await response.json();
        status.textContent = result.message || 'Nomaʼlum xatolik';
        if (result.ok) { form.hidden = true; app.HapticFeedback?.notificationOccurred('success'); }
      } catch { status.textContent = 'Ulanishda xatolik. Internetni tekshirib qayta urinib ko‘ring.'; }
      finally { submit.disabled = false; }
    });
  </script>
</body>
</html>
